<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6f52c9">
  <meta name="application-name" content="머니플로우">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="머니플로우">
  <meta name="mobile-web-app-capable" content="yes">
  <meta property="og:title" content="{% block og_title %}머니플로우{% endblock %}">
  <meta property="og:description" content="{% block og_desc %}오늘의 돈 흐름과 소비 스타일을 가볍게 만나보세요.{% endblock %}">
  <title>{% block title %}머니플로우{% endblock %}</title>

  <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/ui/wealth_check/cat_icon.png') }}">
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/ui/wealth_check/cat_icon.png') }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/jaemulun.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/mobile-fit.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app-chrome.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/ui-quality-pass.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/brand-refresh.css') }}">
  {% block styles %}{% endblock %}
</head>
<body class="app-body {% block body_class %}{% endblock %}">
  {% with messages = get_flashed_messages(with_categories=true) %}{% if messages %}<div class="flash-stack">{% for category, message in messages %}<div class="flash flash-{{ category }}">{{ message }}</div>{% endfor %}</div>{% endif %}{% endwith %}
  {% block body %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
