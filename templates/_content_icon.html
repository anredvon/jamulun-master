{% macro content_icon(name) -%}
  {%- set icon_name = name if name in ['tarot', 'palm', 'lotto', 'check', 'future', 'spending', 'money', 'quote', 'today', 'history'] else 'history' -%}
  <span class="feature-illustration feature-illustration--{{ icon_name }}" aria-hidden="true"></span>
{%- endmacro %}
